<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { background:#050506; color:white; font-family:sans-serif; padding:30px; }
  .box { background:#0d0d10; padding:30px; border-radius:20px; max-width:900px; margin:auto; }
  h1 { margin-bottom:20px; letter-spacing:0.15em; }
  h2 { margin-top:30px; margin-bottom:10px; color:#d3b46a; }
  .item-row { display:flex; justify-content:space-between; border-bottom:1px solid #222; padding:10px 0; }
  .label { color:#d3b46a; font-size:0.8rem; text-transform:uppercase; margin-top:15px; }
  input, select {
    width:100%; padding:12px; border-radius:10px;
    background:#111; border:1px solid #333; color:white; margin-bottom:12px;
  }
  button {
    background:#d3b46a; color:black; padding:12px 20px; border:none;
    border-radius:10px; font-weight:bold; cursor:pointer; margin-top:20px;
  }
</style>
</head>
<body>

<div class="box">
  <h1>ORDER DETAILS</h1>

  <div id="orderInfo"></div>

  <h2>ITEMS</h2>
  <div id="itemsList"></div>

  <h2>ORDER TOTALS</h2>
  <div id="totals"></div>

  <h2>UPDATE ORDER</h2>
  <div id="updateSection"></div>

</div>

<script>
const API_BASE =
  location.hostname.includes("localhost")
    ? "http://localhost:4000"
    : "https://faith-fragrance-backend.onrender.com";

const TOKEN = localStorage.getItem("ff_admin_token");

// Get order ID from URL
const params = new URLSearchParams(location.search);
const orderId = params.get("id");

// Load order
fetch(`${API_BASE}/api/admin/orders`, {
  headers: { Authorization: "Bearer " + TOKEN }
})
  .then(res => res.json())
  .then(all => {
    const order = all.find(o => o.id === orderId);
    renderOrder(order);
  });

function formatPrice(cents) {
  return "$" + (cents / 100).toFixed(2);
}

function renderOrder(order) {
  // CUSTOMER / SHIPPING INFO
  const infoBox = document.getElementById("orderInfo");

  const shipping = order.shipping?.address || {};

  infoBox.innerHTML = `
    <div class="label">Order ID</div>
    <div>${order.id}</div>

    <div class="label">Customer</div>
    <div>${order.customer?.name || ""}</div>

    <div class="label">Email</div>
    <div>${order.customer?.email || ""}</div>

    <div class="label">Shipping Address</div>
    <div>
      ${shipping.line1 || ""}<br>
      ${shipping.line2 || ""}<br>
      ${shipping.city || ""}, ${shipping.state || ""} ${shipping.postal_code || ""}<br>
      ${shipping.country || ""}
    </div>
  `;

  // ITEMS
  const itemsList = document.getElementById("itemsList");
  itemsList.innerHTML = order.items
    .map(i => `
      <div class="item-row">
        <div>${i.name} × ${i.quantity}</div>
        <div>${formatPrice(i.priceCents * i.quantity)}</div>
      </div>
    `)
    .join("");

  // TOTALS
  document.getElementById("totals").innerHTML = `
    <div class="item-row"><div>Subtotal</div><div>${formatPrice(order.totals?.subtotalCents || 0)}</div></div>
    <div class="item-row"><div>Tax</div><div>${formatPrice(order.totals?.taxCents || 0)}</div></div>
    <div class="item-row"><div>Shipping</div><div>${formatPrice(order.totals?.shippingCents || 0)}</div></div>
    <div class="item-row"><strong>Total</strong><strong>${formatPrice(order.totals?.totalCents || 0)}</strong></div>
  `;

  // UPDATE SECTION
  const update = document.getElementById("updateSection");

  const isStripe = order.id.startsWith("ord-");

  update.innerHTML = `
    <div class="label">Order Status</div>
    <select id="statusSelect">
      <option value="pending">Pending</option>
      <option value="processing">Processing</option>
      <option value="shipped">Shipped</option>
      <option value="delivered">Delivered</option>
      <option value="cancelled">Cancelled</option>
    </select>

    ${isStripe ? `
      <div class="label">Payment Status</div>
      <div style="padding:12px 0; color:#888;">Paid via Stripe</div>
    ` : `
      <div class="label">Payment Status</div>
      <select id="paySelect">
        <option value="paid">Paid</option>
        <option value="unpaid">Unpaid</option>
      </select>
    `}

    <div class="label">Tracking Number</div>
    <input id="trackingInput" placeholder="USPS / UPS / FedEx...">

    <button onclick="saveOrder('${order.id}')">Save Changes</button>
  `;

  document.getElementById("statusSelect").value = order.status || "pending";
  if (!isStripe)
    document.getElementById("paySelect").value = order.paymentStatus || "unpaid";
}

function saveOrder(id) {
  const body = {
    status: document.getElementById("statusSelect").value,
    trackingNumber: document.getElementById("trackingInput").value
  };

  // Only send paymentStatus for POS orders
  if (id.startsWith("pos-")) {
    body.paymentStatus = document.getElementById("paySelect").value;
  }

  fetch(`${API_BASE}/api/admin/orders/${id}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + TOKEN
    },
    body: JSON.stringify(body)
  })
    .then(() => alert("Order updated!"));
}
</script>

</body>
</html>
