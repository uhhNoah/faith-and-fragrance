<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Successful – Faith & Fragrance Co.</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      background: #050506;
      color: #f5f3ee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #0d0d10;
      padding: 2rem;
      border-radius: 20px;
      max-width: 500px;
      width: 95%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
    }

    h1 {
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 1rem;
      font-size: 1.4rem;
    }

    .muted {
      color: #9a958a;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .order-line {
      display: flex;
      justify-content: space-between;
      margin: 0.35rem 0;
      color: #d3b46a;
    }

    .btn {
      margin-top: 2rem;
      padding: 0.8rem 1.4rem;
      background: #d3b46a;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      color: #050506;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Thank You!</h1>
  <div class="muted">Your payment was successful.</div>

  <div id="orderDetails" class="muted">Loading order…</div>

  <button class="btn" onclick="window.location.href='../shop.html'">Continue Shopping</button>
</div>

<script>
  const API_BASE = location.hostname.includes("localhost")
    ? "http://localhost:4000"
    : "https://faith-fragrance-backend.onrender.com";

  // Clear local cart
  localStorage.removeItem("ff_cart_v1");

  // Get orderId from URL
  const orderId = new URLSearchParams(window.location.search).get("orderId");
  const detailsEl = document.getElementById("orderDetails");

  if (!orderId) {
    detailsEl.textContent = "Order not found.";
  } else {
    showOrder();
  }

  async function showOrder() {
    try {
      const res = await fetch(API_BASE + "/api/order/" + orderId);
      if (!res.ok) {
        detailsEl.textContent = "Order not found.";
        return;
      }

      const order = await res.json();

      let html = `
        <div style="margin-bottom:1rem;">Order ID: ${order.id}</div>

        <div class="order-line">
          <span>Status</span><span>${order.status}</span>
        </div>

        <div class="order-line">
          <span>Payment</span><span>${order.paymentStatus}</span>
        </div>
      `;

      if (order.totals) {
        html += `
          <div class="order-line">
            <span>Total</span>
            <span>$${(order.totals.totalCents / 100).toFixed(2)}</span>
          </div>
        `;
      }

      detailsEl.innerHTML = html;

    } catch {
      detailsEl.textContent = "Unable to load order.";
    }
  }
</script>

</body>
</html>
