<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout – Faith & Fragrance Co.</title>

  <script src="https://js.stripe.com/v3/"></script>

  <style>
    :root {
      --bg: #050506;
      --bg-alt: #0d0d10;
      --text: #f5f3ee;
      --muted: #9a958a;
      --accent: #d3b46a;
      --danger: #f28b82;
      --success: #8bd59a;
      --max-width: 900px;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #14141b, var(--bg));
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: var(--max-width);
      padding: 2rem 1rem 4rem;
    }

    h1 {
      text-transform: uppercase;
      letter-spacing: 0.15em;
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1.9rem;
    }

    .checkout-card {
      background: var(--bg-alt);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 40px 90px rgba(0,0,0,0.75);
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 2rem;
    }

    @media (max-width: 850px) {
      .checkout-grid {
        grid-template-columns: 1fr;
      }
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    input,
    textarea {
      width: 100%;
      background: #050507;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      padding: 0.7rem;
      color: var(--text);
      font-size: 0.9rem;
    }

    .summary-box {
      background: #0a0a12;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 1.5rem;
    }

    .btn-submit {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.9rem;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #050506;
    }

  </style>
</head>

<body>

<main>

  <div class="back" onclick="window.location.href='../shop.html'">← Continue Shopping</div>

  <h1>Checkout</h1>

  <div class="checkout-card">

    <div class="checkout-grid">

      <!-- LEFT: FORM -->
      <div>
        <div class="section-title">Your Details</div>

        <div style="margin-bottom:1rem;">
          <label>Name</label>
          <input id="checkout-name" required placeholder="Full name">
        </div>

        <div style="margin-bottom:1rem;">
          <label>Email</label>
          <input id="checkout-email" type="email" required placeholder="you@example.com">
        </div>

        <button class="btn-submit" onclick="startCheckout()">Place Order</button>
      </div>

      <!-- RIGHT: ORDER SUMMARY -->
      <div>
        <div class="section-title">Order Summary</div>
        <div class="summary-box" id="orderSummary"></div>
      </div>

    </div>

  </div>

</main>

<script>
  const API_BASE = location.hostname.includes("localhost")
    ? "http://localhost:4000"
    : "https://faith-fragrance-backend.onrender.com";

  let cart = JSON.parse(localStorage.getItem("ff_cart_v1") || "[]");
  const summaryEl = document.getElementById("orderSummary");

  function renderSummary() {
    if (!cart.length) {
      summaryEl.innerHTML = `<div style="color:var(--muted);">Your cart is empty.</div>`;
      return;
    }

    let html = "";
    let subtotal = 0;

    cart.forEach(item => {
      const line = item.priceCents * item.quantity;
      subtotal += line;
      html += `
        <div class="summary-item">
          <span>${item.name} × ${item.quantity}</span>
          <span>$${(line / 100).toFixed(2)}</span>
        </div>
      `;
    });

    html += `<div class="summary-total">
      <span>Subtotal</span>
      <span>$${(subtotal / 100).toFixed(2)}</span>
    </div>`;

    html += `<div class="summary-item" style="margin-top:0.5rem;">
      <span>Tax & Shipping</span>
      <span>Calculated at checkout</span>
    </div>`;

    summaryEl.innerHTML = html;
  }

  renderSummary();

  const stripe = Stripe("pk_test_51SUiEKJXNvaHB9t1rVVwaWFTM4ESa8jktqnuAvVfMa21CHdVEa02UuK9IGC0Yq8NTKv4aUaW9UpjnJ74IWdCv4GO00Y0dgohd9"); // <<< REPLACE

  async function startCheckout() {
    const name = document.getElementById("checkout-name").value.trim();
    const email = document.getElementById("checkout-email").value.trim();

    const payload = {
      items: cart.map(i => ({
        productId: i.productId,
        quantity: i.quantity
      })),
      customer: { name, email }
    };

    const res = await fetch(API_BASE + "/api/checkout/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (data.sessionId) {
      stripe.redirectToCheckout({ sessionId: data.sessionId });
    } else {
      alert("Checkout failed.");
    }
  }
</script>

</body>
</html>
