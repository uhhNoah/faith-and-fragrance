<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin – Faith & Fragrance Co.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root {
      --bg: #050506;
      --bg-alt: #0d0d10;
      --bg-soft: #121218;
      --text: #f5f3ee;
      --muted: #9a958a;
      --accent: #d3b46a;
      --accent-soft: rgba(211,180,106,0.16);
      --border: #26252f;
      --radius: 16px;
      --radius-lg: 26px;
      --radius-pill: 999px;
      --shadow-soft: 0 26px 60px rgba(0,0,0,0.7);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #14141b, var(--bg));
      color: var(--text);
    }

    header {
      padding: 1rem 2rem;
      background: rgba(10,10,14,0.95);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .site-logo {
      height: 40px;
      border-radius: 8px;
    }

    .logo-text {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text);
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 2rem;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 1.4rem;
    }

    .card-section {
      background: var(--bg-soft);
      padding: 1.7rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      margin-bottom: 2rem;
      box-shadow: var(--shadow-soft);
    }

    .card-title {
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.16em;
      margin-bottom: 1rem;
      color: var(--accent);
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.78rem;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    input, textarea, select {
      width: 100%;
      padding: 0.75rem;
      border-radius: var(--radius-pill);
      background: #0b0b11;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      margin-bottom: 1rem;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
      border-radius: 12px;
    }

    .btn {
      padding: 0.65rem 1.4rem;
      border-radius: var(--radius-pill);
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #050506;
    }

    .btn-ghost {
      background: #101018;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .admin-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 1.4rem;
    }

    .admin-tab {
      padding: 0.5rem 1.4rem;
      border-radius: var(--radius-pill);
      background: #0b0b11;
      border: 1px solid var(--border);
      text-transform: uppercase;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      color: var(--muted);
      cursor: pointer;
    }

    .admin-tab.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    .admin-tab-panel { display: none; }
    .admin-tab-panel.active { display: block; }

    .status {
      min-height: 1rem;
      margin-top: 0.5rem;
      font-size: 0.82rem;
    }

    .status-error { color: #ff8c8c; }
    .status-success { color: #8cffb1; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      background: rgba(255,255,255,0.02);
      border-radius: 14px;
      overflow: hidden;
    }

    th, td {
      padding: 0.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <div class="nav-left">
      <img src="Assets/logo.png" class="site-logo">
      <div class="logo-text">FAITH & FRAGRANCE CO.</div>
    </div>
  </div>
</header>

<main>
  <h1>Admin Dashboard</h1>

  <!-- LOGIN -->
  <div class="card-section" id="loginSection">
    <div class="card-title">Sign In</div>

    <label>Email</label>
    <input type="email" id="adminEmail">

    <label>Password</label>
    <input type="password" id="adminPassword">

    <button class="btn btn-primary" id="adminLoginButton">Sign In</button>
    <div id="adminStatus" class="status"></div>
  </div>

  <!-- ADMIN PANEL -->
  <div class="card-section" id="adminPanel" style="display:none;">
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="productsTab">Products</button>
      <button class="admin-tab" data-tab="ordersTab">Orders</button>
      <button class="admin-tab" data-tab="subscribersTab">Subscribers</button>
      <button class="admin-tab" data-tab="discountsTab">Discounts</button>
      <button class="admin-tab" data-tab="posTab">POS</button>
      <button class="admin-tab" data-tab="abandonedTab">Abandoned</button>
      <button class="admin-tab" data-tab="blastTab">Email Blast</button>
    </div>
    <!-- PRODUCTS TAB -->
    <div id="productsTab" class="admin-tab-panel active">

      <!-- ADD PRODUCT -->
      <div class="card-section">
        <div class="card-title">Add Product</div>

        <label>Name</label>
        <input id="productName">

        <label>Collection</label>
        <input id="productCollection">

        <label>Price (USD)</label>
        <input id="productPrice" type="number" min="0" step="0.01">

        <label>Description</label>
        <textarea id="productDescription"></textarea>

        <label>Image</label>
        <input id="productImage" type="file" accept="image/*">

        <button class="btn btn-primary btn-small" id="addProductButton">Add Product</button>
        <div id="adminProductsStatus" class="status"></div>
      </div>

      <!-- PRODUCT LIST -->
      <div class="card-section">
        <div class="card-title">Products</div>
        <button class="btn btn-ghost btn-small" id="refreshProductsButton">Refresh</button>
        <div id="adminProductsList"></div>
      </div>
    </div>

    <!-- ORDERS TAB -->
    <div id="ordersTab" class="admin-tab-panel">
      <div class="card-section">
        <div class="card-title">Orders</div>

        <input id="ordersSearchInput" placeholder="Search orders…">
        <button class="btn btn-ghost btn-small" id="refreshOrdersButton">Refresh</button>

        <div id="adminOrdersStatus" class="status"></div>
        <div id="adminOrdersList"></div>

        <div style="display:flex; gap:1rem; margin-top:0.5rem;">
          <button class="btn btn-ghost btn-small" id="ordersPrevPage">Previous</button>
          <button class="btn btn-ghost btn-small" id="ordersNextPage">Next</button>
        </div>
      </div>
    </div>

        <!-- SUBSCRIBERS TAB -->
    <div id="subscribersTab" class="admin-tab-panel">
      <div class="card-section">
        <div class="card-title">Email Subscribers</div>

        <button class="btn btn-ghost btn-small" id="refreshSubscribersButton">Refresh</button>

        <div id="adminSubscribersStatus" class="status"></div>
        <div id="adminSubscribersList"></div>
      </div>
    </div>

    <!-- DISCOUNTS TAB -->
    <div id="discountsTab" class="admin-tab-panel">
      <div class="card-section">
        <div class="card-title">Create Discount</div>

        <label>Code</label>
        <input id="d-code">

        <label>Type</label>
        <select id="d-type">
          <option value="percent">Percent</option>
          <option value="fixed">Fixed (amount)</option>
        </select>

        <label>Amount</label>
        <input id="d-amount" type="number">

        <button class="btn btn-primary btn-small" id="createDiscountBtn">Create Discount</button>
        <div id="discountsStatus" class="status"></div>
      </div>

      <div class="card-section">
        <div class="card-title">Existing Discount Codes</div>
        <div id="discountsList"></div>
      </div>
    </div>

    <!-- POS TAB -->
    <div id="posTab" class="admin-tab-panel">
      <div class="card-section">
        <div class="card-title">Point of Sale (POS)</div>

        <div id="posProductList"></div>
        <button class="btn btn-primary btn-small" id="submitPosSale">Submit POS Sale</button>
        <div id="posStatus" class="status"></div>
      </div>

      <div class="card-section">
        <div class="card-title">POS Sales History</div>
        <div id="posSalesTable"></div>
      </div>
    </div>

    <!-- ABANDONED CARTS TAB -->
    <div id="abandonedTab" class="admin-tab-panel">
      <div class="card-section">
        <div class="card-title">Abandoned Carts</div>

        <button class="btn btn-ghost btn-small" id="refreshAbandonedButton">Refresh</button>

        <div id="abandonedStatus" class="status"></div>
        <div id="abandonedList"></div>
      </div>
    </div>

    <!-- EMAIL BLAST TAB -->
    <div id="blastTab" class="admin-tab-panel">
      <div class="card-section">
        <div class="card-title">Send Email Blast</div>

        <label>Subject</label>
        <input id="blastSubject">

        <label>Message</label>
        <textarea id="blastBody"></textarea>

        <button class="btn btn-primary btn-small" id="sendBlastBtn">Send Email</button>
        <div id="blastStatus" class="status"></div>
      </div>
    </div>

    <button class="btn btn-ghost btn-small" id="logoutButton">Log Out</button>
  </div> <!-- end adminPanel -->
</main>

<script>
/* =======================================
   BASE CONFIG + UTILITIES
======================================= */

const API_BASE =
  location.hostname === "localhost" || location.hostname === "127.0.0.1"
    ? "http://localhost:4000"
    : "https://faith-fragrance-backend.onrender.com";

const TOKEN_KEY = "ff_admin_token";
const getToken = () => localStorage.getItem(TOKEN_KEY) || "";
const saveToken = t => localStorage.setItem(TOKEN_KEY, t);
const clearToken = () => localStorage.removeItem(TOKEN_KEY);

const formatPrice = cents => "$" + (cents / 100).toFixed(2);
const escapeHtml = str => (str || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const formatDate = d => new Date(d).toLocaleString();

/* =======================================
   ELEMENT REFS
======================================= */

const loginSection = document.getElementById("loginSection");
const adminPanel = document.getElementById("adminPanel");
const adminStatus = document.getElementById("adminStatus");
const adminEmail = document.getElementById("adminEmail");
const adminPassword = document.getElementById("adminPassword");
const adminLoginButton = document.getElementById("adminLoginButton");
const logoutButton = document.getElementById("logoutButton");

const tabButtons = document.querySelectorAll(".admin-tab");
const tabPanels = document.querySelectorAll(".admin-tab-panel");

/* Product refs */
const productsListEl = document.getElementById("adminProductsList");
const refreshProductsButton = document.getElementById("refreshProductsButton");
const addProductButton = document.getElementById("addProductButton");
const adminProductsStatus = document.getElementById("adminProductsStatus");
const productImageInput = document.getElementById("productImage");

/* Orders refs */
const ordersListEl = document.getElementById("adminOrdersList");
const ordersSearchInput = document.getElementById("ordersSearchInput");
const ordersPrevPageBtn = document.getElementById("ordersPrevPage");
const ordersNextPageBtn = document.getElementById("ordersNextPage");
const refreshOrdersButton = document.getElementById("refreshOrdersButton");
const adminOrdersStatus = document.getElementById("adminOrdersStatus");

/* Subscribers */
const refreshSubscribersButton = document.getElementById("refreshSubscribersButton");
const adminSubscribersList = document.getElementById("adminSubscribersList");
const adminSubscribersStatus = document.getElementById("adminSubscribersStatus");

/* Discounts */
const createDiscountBtn = document.getElementById("createDiscountBtn");
const discountCodeInput = document.getElementById("d-code");
const discountTypeInput = document.getElementById("d-type");
const discountAmountInput = document.getElementById("d-amount");
const discountsListEl = document.getElementById("discountsList");

/* POS */
const posProductListEl = document.getElementById("posProductList");
const submitPosSaleBtn = document.getElementById("submitPosSale");
const posSalesTableEl = document.getElementById("posSalesTable");

/* Abandoned carts */
const refreshAbandonedButton = document.getElementById("refreshAbandonedButton");
const abandonedListEl = document.getElementById("abandonedList");

/* Email Blast */
const blastSubjectEl = document.getElementById("blastSubject");
const blastBodyEl = document.getElementById("blastBody");
const sendBlastBtn = document.getElementById("sendBlastBtn");

/* =======================================
   LOGIN / LOGOUT
======================================= */

adminLoginButton.addEventListener("click", async () => {
  const email = adminEmail.value.trim();
  const password = adminPassword.value;

  adminStatus.textContent = "Signing in…";
  adminLoginButton.disabled = true;

  try {
    const res = await fetch(API_BASE + "/api/admin/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();
    if (!res.ok) {
      adminStatus.textContent = data.error;
      adminStatus.className = "status status-error";
      return;
    }

    saveToken(data.token);
    adminStatus.textContent = "Signed in.";
    adminStatus.className = "status status-success";

    loginSection.style.display = "none";
    adminPanel.style.display = "block";

    initData();

  } catch (err) {
    adminStatus.textContent = "Server error.";
    adminStatus.className = "status status-error";
  }

  adminLoginButton.disabled = false;
});

logoutButton.addEventListener("click", () => {
  clearToken();
  adminPanel.style.display = "none";
  loginSection.style.display = "block";
});

/* =======================================
   TABS
======================================= */

tabButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    const tab = btn.dataset.tab;

    tabButtons.forEach(b => b.classList.remove("active"));
    tabPanels.forEach(p => p.classList.remove("active"));

    btn.classList.add("active");
    document.getElementById(tab).classList.add("active");
  });
});

/* =======================================
   PRODUCTS
======================================= */

let productsById = {};

function setProductsStatus(msg, err) {
  adminProductsStatus.textContent = msg;
  adminProductsStatus.className = "status " + (err ? "status-error" : "status-success");
}

async function loadProducts() {
  setProductsStatus("Loading…");

  try {
    const res = await fetch(API_BASE + "/api/admin/products", {
      headers: { Authorization: "Bearer " + getToken() }
    });

    const data = await res.json();
    if (!res.ok) {
      setProductsStatus(data.error, true);
      return;
    }

    productsById = {};
    data.forEach(p => productsById[p.id] = p);
    renderProducts(Object.values(productsById));
    setProductsStatus("");

  } catch {
    setProductsStatus("Backend error", true);
  }
}

function renderProducts(list) {
  if (!list.length) {
    productsListEl.innerHTML = "<div>No products.</div>";
    return;
  }

  const rows = list.map(p => {
    const img = p.imageUrl ? `<img src="${p.imageUrl}" style="height:40px;border-radius:6px;">` : "No image";
    const active = p.active !== false;

    return `
      <tr>
        <td>${escapeHtml(p.name)}</td>
        <td>${escapeHtml(p.collection || "")}</td>
        <td>${formatPrice(p.priceCents)}</td>
        <td>${escapeHtml(p.description || "")}</td>

        <td>
          <span>${active ? "Active" : "Hidden"}</span>
          <button data-action="toggle" data-id="${p.id}" class="btn btn-ghost btn-xs">
            ${active ? "Hide" : "Show"}
          </button>
        </td>

        <td>
          ${img}
          <button class="btn btn-ghost btn-xs" data-action="change-img" data-id="${p.id}">
            Change
          </button>
          <input type="file" accept="image/*" class="hidden-file-input" data-id="${p.id}" style="display:none;">
        </td>

        <td>
          <button class="btn btn-primary btn-xs" data-action="edit" data-id="${p.id}">Edit</button>
          <button class="btn btn-ghost btn-xs" data-action="delete" data-id="${p.id}">Delete</button>
        </td>
      </tr>
    `;
  }).join("");

  productsListEl.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Collection</th><th>Price</th>
          <th>Description</th><th>Status</th><th>Image</th><th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

/* ADD PRODUCT */
addProductButton.addEventListener("click", async () => {
  const name = document.getElementById("productName").value.trim();
  const collection = document.getElementById("productCollection").value.trim();
  const price = parseFloat(document.getElementById("productPrice").value);
  const description = document.getElementById("productDescription").value.trim();
  const imageFile = productImageInput.files[0];

  if (!name || isNaN(price)) return setProductsStatus("Name + price required", true);

  addProductButton.disabled = true;

  try {
    const res = await fetch(API_BASE + "/api/admin/products", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + getToken()
      },
      body: JSON.stringify({
        name,
        collection,
        description,
        priceCents: Math.round(price * 100)
      })
    });

    const product = await res.json();

    if (!res.ok) {
      setProductsStatus(product.error, true);
      return;
    }

    /* Upload image if exists */
    if (imageFile) {
      const fd = new FormData();
      fd.append("image", imageFile);

      await fetch(API_BASE + "/api/admin/products/" + product.id + "/image", {
        method: "POST",
        headers: { Authorization: "Bearer " + getToken() },
        body: fd
      });
    }

    setProductsStatus("Product added.");
    loadProducts();

  } catch (err) {
    setProductsStatus("Backend error", true);
  }

  addProductButton.disabled = false;
});

/* PRODUCT ROW ACTIONS */
productsListEl.addEventListener("click", async e => {
  const btn = e.target.closest("button");
  if (!btn) return;

  const id = btn.dataset.id;
  const action = btn.dataset.action;

  if (action === "delete") {
    if (!confirm("Delete?")) return;

    await fetch(API_BASE + "/api/admin/products/" + id, {
      method: "DELETE",
      headers: { Authorization: "Bearer " + getToken() }
    });

    loadProducts();
    return;
  }

  if (action === "toggle") {
    await fetch(API_BASE + "/api/admin/products/" + id, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + getToken()
      },
      body: JSON.stringify({ active: !(productsById[id].active !== false) })
    });

    loadProducts();
    return;
  }

  if (action === "change-img") {
    const input = productsListEl.querySelector(`input[data-id='${id}']`);
    if (input) input.click();
  }
});

/* IMAGE UPLOAD */
productsListEl.addEventListener("change", async e => {
  const input = e.target;
  if (!input.classList.contains("hidden-file-input")) return;

  const id = input.dataset.id;
  const file = input.files[0];

  const fd = new FormData();
  fd.append("image", file);

  await fetch(API_BASE + "/api/admin/products/" + id + "/image", {
    method: "POST",
    headers: { Authorization: "Bearer " + getToken() },
    body: fd
  });

  loadProducts();
});

/* =======================================
   ORDERS
======================================= */

let orders = [];
let ordersFiltered = [];
let ordersPage = 0;
const ORDERS_PER_PAGE = 10;

async function loadOrders() {
  adminOrdersStatus.textContent = "Loading…";

  const res = await fetch(API_BASE + "/api/admin/orders", {
    headers: { Authorization: "Bearer " + getToken() }
  });

  const data = await res.json();
  if (!res.ok) {
    adminOrdersStatus.textContent = data.error;
    return;
  }

  orders = data;
  ordersFiltered = orders.slice();
  ordersPage = 0;

  renderOrders();
  adminOrdersStatus.textContent = "";
}

function renderOrders() {
  if (!ordersFiltered.length) {
    ordersListEl.innerHTML = "<div>No orders.</div>";
    return;
  }

  const start = ordersPage * ORDERS_PER_PAGE;
  const page = ordersFiltered.slice(start, start + ORDERS_PER_PAGE);

  const rows = page.map(o => `
    <tr onclick="window.location='admin-order.html?id=${o.id}'" style="cursor:pointer;">
      <td>${escapeHtml(o.id.slice(0, 10))}</td>
      <td>${escapeHtml(o.customer?.email || "")}</td>
      <td>${formatPrice(o.totals?.totalCents || 0)}</td>
      <td>${escapeHtml(o.status || "")}</td>
      <td>${formatDate(o.createdAt)}</td>
    </tr>
  `).join("");

  ordersListEl.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Email</th><th>Total</th><th>Status</th><th>Date</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

ordersSearchInput.addEventListener("input", () => {
  const term = ordersSearchInput.value.toLowerCase();
  ordersFiltered = orders.filter(
    o =>
      o.id.toLowerCase().includes(term) ||
      (o.customer?.email || "").toLowerCase().includes(term)
  );
  ordersPage = 0;
  renderOrders();
});

ordersPrevPageBtn.addEventListener("click", () => {
  ordersPage = Math.max(0, ordersPage - 1);
  renderOrders();
});

ordersNextPageBtn.addEventListener("click", () => {
  ordersPage++;
  renderOrders();
});

refreshOrdersButton.addEventListener("click", loadOrders);

/* =======================================
   SUBSCRIBERS
======================================= */

async function loadSubscribers() {
  adminSubscribersStatus.textContent = "Loading…";

  const res = await fetch(API_BASE + "/api/admin/subscribers", {
    headers: { Authorization: "Bearer " + getToken() }
  });

  const data = await res.json();
  if (!res.ok) {
    adminSubscribersStatus.textContent = data.error;
    return;
  }

  const rows = data.map(s => `
    <tr>
      <td>${escapeHtml(s.email)}</td>
      <td>${formatDate(s.joinedAt)}</td>
      <td>${escapeHtml(s.source || "")}</td>
    </tr>
  `).join("");

  adminSubscribersList.innerHTML = `
    <table>
      <thead><tr><th>Email</th><th>Date</th><th>Source</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  adminSubscribersStatus.textContent = "";
}

refreshSubscribersButton.addEventListener("click", loadSubscribers);

/* =======================================
   DISCOUNTS
======================================= */

async function loadDiscounts() {
  discountsListEl.innerHTML = "Loading…";

  const res = await fetch(API_BASE + "/api/admin/discounts", {
    headers: { Authorization: "Bearer " + getToken() }
  });

  const data = await res.json();
  if (!res.ok) {
    discountsListEl.innerHTML = data.error;
    return;
  }

  const rows = data.map(d => `
    <tr>
      <td>${escapeHtml(d.code)}</td>
      <td>${escapeHtml(d.type)}</td>
      <td>${d.type === "percent" ? d.amount + "%" : formatPrice(d.amount)}</td>
      <td><button data-id="${d.id}" data-action="del-d" class="btn btn-ghost btn-xs">Delete</button></td>
    </tr>
  `).join("");

  discountsListEl.innerHTML = `
    <table>
      <thead><tr><th>Code</th><th>Type</th><th>Amount</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

createDiscountBtn.addEventListener("click", async () => {
  const code = discountCodeInput.value.trim().toUpperCase();
  const type = discountTypeInput.value;
  const amountInput = discountAmountInput.value.trim();

  if (!code || !amountInput) return alert("Enter all fields");

  let amount =
    type === "percent"
      ? parseInt(amountInput)
      : Math.round(parseFloat(amountInput) * 100);

  await fetch(API_BASE + "/api/admin/discounts", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + getToken()
    },
    body: JSON.stringify({ code, type, amount })
  });

  loadDiscounts();
});

discountsListEl.addEventListener("click", async e => {
  const btn = e.target.closest("button");
  if (!btn) return;

  if (btn.dataset.action === "del-d") {
    await fetch(API_BASE + "/api/admin/discounts/" + btn.dataset.id, {
      method: "DELETE",
      headers: { Authorization: "Bearer " + getToken() }
    });
    loadDiscounts();
  }
});

/* =======================================
   POS
======================================= */

let posCart = [];

async function loadPOSProducts() {
  const res = await fetch(API_BASE + "/api/admin/products", {
    headers: { Authorization: "Bearer " + getToken() }
  });

  const list = await res.json();

  posProductListEl.innerHTML = list
    .map(
      p => `
      <div style="padding:0.4rem 0; border-bottom:1px solid #222;">
        ${escapeHtml(p.name)} – ${formatPrice(p.priceCents)}
        <button class="btn btn-primary btn-xs" data-id="${p.id}" data-action="add-pos">
          Add
        </button>
      </div>
    `
    )
    .join("");
}

posProductListEl.addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;

  if (btn.dataset.action === "add-pos") {
    const id = btn.dataset.id;

    const existing = posCart.find(i => i.id === id);
    if (existing) existing.qty++;
    else posCart.push({ id, qty: 1 });

    renderPOSCart();
  }
});

function renderPOSCart() {
  if (!posCart.length) {
    posSalesTableEl.innerHTML = "<div>No items.</div>";
    return;
  }

  const rows = posCart
    .map(
      i => `
      <tr>
        <td>${i.id}</td>
        <td>${i.qty}</td>
        <td>
          <button data-id="${i.id}" data-action="inc" class="btn btn-ghost btn-xs">+</button>
          <button data-id="${i.id}" data-action="dec" class="btn btn-ghost btn-xs">-</button>
          <button data-id="${i.id}" data-action="rm" class="btn btn-ghost btn-xs">Remove</button>
        </td>
      </tr>
    `
    )
    .join("");

  posSalesTableEl.innerHTML = `
    <table>
      <thead><tr><th>ID</th><th>Qty</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

posSalesTableEl.addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;

  const id = btn.dataset.id;
  const item = posCart.find(i => i.id === id);
  if (!item) return;

  if (btn.dataset.action === "inc") item.qty++;
  if (btn.dataset.action === "dec") item.qty = Math.max(1, item.qty - 1);
  if (btn.dataset.action === "rm") posCart = posCart.filter(i => i.id !== id);

  renderPOSCart();
});

submitPosSaleBtn.addEventListener("click", async () => {
  if (!posCart.length) return alert("Empty cart");

  await fetch(API_BASE + "/api/admin/pos-sale", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + getToken()
    },
    body: JSON.stringify({ items: posCart })
  });

  alert("Sale recorded");
  posCart = [];
  renderPOSCart();
});

/* =======================================
   ABANDONED CARTS
======================================= */

async function loadAbandoned() {
  const res = await fetch(API_BASE + "/api/admin/abandoned", {
    headers: { Authorization: "Bearer " + getToken() }
  });

  const list = await res.json();

  abandonedListEl.innerHTML = list
    .map(
      c => `
      <tr>
        <td>${escapeHtml(c.email)}</td>
        <td>${(c.items || []).length}</td>
        <td>${formatPrice(c.totalCents || 0)}</td>
        <td>${formatDate(c.updatedAt)}</td>
        <td>
          <button data-id="${c.id}" data-action="recover" class="btn btn-primary btn-xs">
            Send Email
          </button>
        </td>
      </tr>
    `
    )
    .join("");

  abandonedListEl.innerHTML = `
    <table>
      <thead><tr><th>Email</th><th>Items</th><th>Total</th><th>Last Active</th><th></th></tr></thead>
      <tbody>${abandonedListEl.innerHTML}</tbody>
    </table>
  `;
}

refreshAbandonedButton.addEventListener("click", loadAbandoned);

/* =======================================
   EMAIL BLAST
======================================= */

sendBlastBtn.addEventListener("click", async () => {
  const subject = blastSubjectEl.value.trim();
  const body = blastBodyEl.value.trim();

  if (!subject || !body) return alert("Fill subject + body");

  await fetch(API_BASE + "/api/admin/email-blast", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + getToken()
    },
    body: JSON.stringify({ subject, body })
  });

  alert("Blast sent");
});

   INIT ALL DATA
======================================= */

function initData() {
  loadProducts();
  loadOrders();
  loadSubscribers();
  loadDiscounts();
  loadPOSProducts();
  loadAbandoned();
}
