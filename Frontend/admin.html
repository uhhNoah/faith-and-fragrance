<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin Dashboard — Faith & Fragrance Co.</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    :root {
        --bg: #050506;
        --sidebar: #0c0c0f;
        --panel: #111118;
        --text: #f4f4f7;
        --muted: #a5a5b5;
        --accent: #d3b46a;
        --danger: #c05050;
        --green: #5fcf7a;
        --border: #1c1c23;
    }

    body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
        width: 240px;
        background: var(--sidebar);
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
    }

    .side-item {
        padding: 15px 25px;
        cursor: pointer;
        font-size: 15px;
        border-left: 3px solid transparent;
        color: var(--muted);
        transition: 0.15s;
    }
    .side-item:hover {
        background: rgba(255,255,255,0.05);
        color: var(--text);
    }
    .side-item.active {
        color: var(--accent);
        border-color: var(--accent);
    }

    /* Main Panel */
    #main {
        flex: 1;
        padding: 25px;
        overflow-y: auto;
    }

    h2 {
        margin-top: 0;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .panel {
        background: var(--panel);
        padding: 20px;
        border-radius: 8px;
        border: 1px solid var(--border);
        margin-bottom: 25px;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        margin-bottom: 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #0f0f16;
        color: var(--text);
    }

    button {
        background: var(--accent);
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        color: #000;
        margin-top: 10px;
    }
    button.red { background: var(--danger); color: #fff; }
    button.green { background: var(--green); color: #000; }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
    }

    th, td {
        padding: 10px;
        border-bottom: 1px solid var(--border);
    }

    th {
        background: rgba(255,255,255,0.05);
        text-align: left;
        font-size: 14px;
    }

    .hidden { display: none; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
    <div class="side-item active" data-tab="products">Products</div>
    <div class="side-item" data-tab="orders">Orders</div>
    <div class="side-item" data-tab="discounts">Discounts</div>
    <div class="side-item" data-tab="pos">POS Sales</div>
    <div class="side-item" data-tab="subscribers">Subscribers</div>
    <div class="side-item" data-tab="abandoned">Abandoned Carts</div>
</div>

<!-- MAIN PANEL -->
<div id="main">

    <!-- PRODUCTS TAB -->
    <div id="tab-products" class="tab panel">
        <h2>Products</h2>

        <h3>Add Product</h3>
        <input id="p-name" placeholder="Name" />
        <input id="p-price" placeholder="Price (cents)" type="number" />
        <input id="p-collection" placeholder="Collection (e.g., candles)" />
        <textarea id="p-desc" placeholder="Description"></textarea>
        <input id="p-stock" placeholder="Stock (leave empty if N/A)" type="number" />
        <label><input id="p-track" type="checkbox" /> Track Inventory</label>
        <button onclick="addProduct()">Add Product</button>

        <h3 style="margin-top:40px;">All Products</h3>
        <table id="products-table"></table>
    </div>

    <!-- ORDERS TAB -->
    <div id="tab-orders" class="tab panel hidden">
        <h2>Orders</h2>
        <table id="orders-table"></table>
        <div id="order-detail"></div>
    </div>

    <!-- DISCOUNTS TAB -->
    <div id="tab-discounts" class="tab panel hidden">
        <h2>Discount Codes</h2>

        <h3>Create Discount</h3>
        <input id="d-code" placeholder="CODE" />
        <select id="d-type">
            <option value="percent">Percent (%)</option>
            <option value="fixed">Fixed Amount (cents)</option>
        </select>
        <input id="d-amount" type="number" placeholder="Amount" />
        <button onclick="createDiscount()">Create Discount</button>

        <h3 style="margin-top:40px;">Existing Discounts</h3>
        <table id="discounts-table"></table>
    </div>

    <!-- POS TAB -->
    <div id="tab-pos" class="tab panel hidden">
        <h2>POS Sale</h2>

        <div id="pos-products"></div>

        <button onclick="submitPOS()">Submit POS Sale</button>

        <h3 style="margin-top:40px;">POS Sales</h3>
        <table id="pos-sales-table"></table>
    </div>

    <!-- SUBSCRIBERS TAB -->
    <div id="tab-subscribers" class="tab panel hidden">
        <h2>Subscribers</h2>
        <table id="subscribers-table"></table>

        <h3 style="margin-top:30px;">Send Email Blast</h3>
        <input id="blast-subject" placeholder="Subject" />
        <textarea id="blast-body" placeholder="Email body..."></textarea>
        <button onclick="sendBlast()">Send</button>
    </div>

    <!-- ABANDONED CARTS TAB -->
    <div id="tab-abandoned" class="tab panel hidden">
        <h2>Abandoned Carts</h2>
        <table id="abandoned-table"></table>
    </div>

</div>

<script>
const API = ""; // same origin

let adminToken = localStorage.getItem("adminToken");
if (!adminToken) {
    const pass = prompt("Admin Password:");
    fetch(API + "/api/admin/login", {
        method: "POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ email: "<?php echo '';?>", password: pass })
    })
    .then(r=>r.json())
    .then(d=>{
        if(d.token){
            localStorage.setItem("adminToken", d.token);
            adminToken = d.token;
            loadAll();
        } else {
            alert("Wrong password.");
        }
    });
} else {
    loadAll();
}

function authHeaders(){
    return { "Authorization": "Bearer " + adminToken };
}

/* TAB SWITCHING */
document.querySelectorAll(".side-item").forEach(item=>{
    item.onclick = ()=>{
        document.querySelectorAll(".side-item").forEach(i=>i.classList.remove("active"));
        item.classList.add("active");
        const tab = item.dataset.tab;
        document.querySelectorAll(".tab").forEach(t=>t.classList.add("hidden"));
        document.getElementById("tab-"+tab).classList.remove("hidden");
    };
});

/* LOAD EVERYTHING */
function loadAll(){
    loadProducts();
    loadOrders();
    loadDiscounts();
    loadPOS();
    loadSubscribers();
    loadAbandoned();
}

/* PRODUCTS */
function loadProducts(){
    fetch(API + "/api/admin/products", { headers: authHeaders() })
    .then(r=>r.json())
    .then(list=>{
        let html = `
        <tr><th>Name</th><th>Price</th><th>Stock</th><th>Active</th><th>Actions</th></tr>
        `;
        list.forEach(p=>{
            html += `
            <tr>
                <td>${p.name}</td>
                <td>$${(p.priceCents/100).toFixed(2)}</td>
                <td>${p.stock ?? "-"}</td>
                <td>${p.active ? "Yes" : "No"}</td>
                <td>
                    <button onclick="deleteProduct('${p.id}')" class="red">Delete</button>
                </td>
            </tr>`;
        });
        document.getElementById("products-table").innerHTML = html;

        // POS product buttons
        let posHtml = "";
        list.forEach(p=>{
            posHtml += `
            <div style="margin-bottom:10px;">
                <strong>${p.name}</strong> — $${(p.priceCents/100).toFixed(2)}
                <input type="number" id="pos-${p.id}" placeholder="Qty" style="width:80px;margin-left:10px;">
            </div>`;
        });
        document.getElementById("pos-products").innerHTML = posHtml;
    });
}
function addProduct(){
    const data = {
        name: document.getElementById("p-name").value,
        priceCents: Number(document.getElementById("p-price").value),
        collection: document.getElementById("p-collection").value,
        description: document.getElementById("p-desc").value,
        stock: Number(document.getElementById("p-stock").value),
        trackInventory: document.getElementById("p-track").checked
    };
    fetch(API+"/api/admin/products", {
        method: "POST",
        headers: { ...authHeaders(), "Content-Type":"application/json" },
        body: JSON.stringify(data)
    })
    .then(()=>loadProducts());
}

function deleteProduct(id){
    if(!confirm("Delete product?")) return;
    fetch(API+"/api/admin/products/"+id, {
        method:"DELETE",
        headers: authHeaders()
    }).then(()=>loadProducts());
}

/* ORDERS */
function loadOrders(){
    fetch(API + "/api/admin/orders", { headers: authHeaders() })
    .then(r=>r.json())
    .then(list=>{
        let html = `
        <tr><th>ID</th><th>Email</th><th>Total</th><th>Status</th><th>View</th></tr>
        `;
        list.forEach(o=>{
            html += `
            <tr>
                <td>${o.id}</td>
                <td>${o.customer?.email}</td>
                <td>${o.totals?.totalCents ? "$"+(o.totals.totalCents/100).toFixed(2) : "-"}</td>
                <td>${o.status}</td>
                <td><button onclick="viewOrder('${o.id}')">Open</button></td>
            </tr>`;
        });
        document.getElementById("orders-table").innerHTML = html;
    });
}

function viewOrder(id){
    const container = document.getElementById("order-detail");
    fetch(API + "/api/admin/orders", { headers: authHeaders() })
    .then(r=>r.json())
    .then(list=>{
        const o = list.find(x=>x.id===id);
        if(!o) return;

        let itemsHtml = "";
        o.items.forEach(i=>{
            itemsHtml += `<li>${i.name} x ${i.quantity} — $${((i.priceCents*i.quantity)/100).toFixed(2)}</li>`;
        });

        container.innerHTML = `
            <div class="panel" style="margin-top:20px;">
                <h3>Order ${o.id}</h3>

                <strong>Customer</strong><br>
                ${o.customer?.name}<br>
                ${o.customer?.email}<br><br>

                <strong>Items</strong>
                <ul>${itemsHtml}</ul>

                <strong>Totals</strong><br>
                Subtotal: $${(o.totals?.subtotalCents/100).toFixed(2)}<br>
                Tax: $${(o.totals?.taxCents/100).toFixed(2)}<br>
                Shipping: $${(o.totals?.shippingCents/100).toFixed(2)}<br>
                Total: <strong>$${(o.totals?.totalCents/100).toFixed(2)}</strong><br><br>

                <strong>Shipping Info</strong><br>
                ${(o.shipping?.name || "")}<br>
                ${(o.shipping?.address?.line1 || "")}<br>
                ${(o.shipping?.address?.line2 || "")}<br>
                ${(o.shipping?.address?.city || "")},
                ${(o.shipping?.address?.state || "")}
                ${(o.shipping?.address?.postal_code || "")}<br>
                ${(o.shipping?.address?.country || "")}<br><br>

                <strong>Order Status</strong><br>
                <select id="ord-status">
                    <option value="new">New</option>
                    <option value="processing">Processing</option>
                    <option value="shipped">Shipped</option>
                </select>

                <br><br>
                <strong>Tracking Number</strong>
                <input id="ord-track" placeholder="Tracking #" value="${o.trackingNumber || ""}" />

                <button onclick="saveOrder('${o.id}')">Save</button>
            </div>
        `;

        document.getElementById("ord-status").value = o.status;
    });
}

function saveOrder(id){
    const data = {
        status: document.getElementById("ord-status").value,
        trackingNumber: document.getElementById("ord-track").value
    };
    fetch(API+"/api/admin/orders/"+id, {
        method:"PUT",
        headers:{ ...authHeaders(), "Content-Type":"application/json" },
        body: JSON.stringify(data)
    }).then(()=>{
        alert("Saved");
        loadOrders();
    });
}

/* DISCOUNTS */
function loadDiscounts(){
    fetch(API + "/api/admin/discounts", { headers: authHeaders() })
    .then(r=>r.json())
    .then(list=>{
        let html = `<tr><th>Code</th><th>Type</th><th>Amount</th></tr>`;
        list.forEach(d=>{
            html += `
            <tr>
                <td>${d.code}</td>
                <td>${d.type}</td>
                <td>${d.amount}</td>
            </tr>`;
        });
        document.getElementById("discounts-table").innerHTML = html;
    });
}

function createDiscount(){
    const data = {
        code: document.getElementById("d-code").value,
        type: document.getElementById("d-type").value,
        amount: Number(document.getElementById("d-amount").value)
    };
    fetch(API+"/api/admin/discounts", {
        method:"POST",
        headers:{ ...authHeaders(), "Content-Type":"application/json" },
        body: JSON.stringify(data)
    }).then(()=>loadDiscounts());
}

/* POS */
function submitPOS(){
    const items = [];
    document.querySelectorAll("[id^='pos-']").forEach(inp=>{
        const qty = Number(inp.value);
        if(qty > 0){
            const id = inp.id.replace("pos-","");
            items.push({ productId:id, quantity:qty });
        }
    });

    if(items.length === 0) return alert("No items");

    fetch(API+"/api/pos/sale",{
        method:"POST",
        headers:{ ...authHeaders(), "Content-Type":"application/json" },
        body: JSON.stringify({ items })
    }).then(()=>{
        alert("POS sale recorded");
        loadPOS();
    });
}

function loadPOS(){
    fetch(API + "/api/admin/pos-sales", { headers: authHeaders() })
    .then(r=>r.json())
    .then(list=>{
        let html = `<tr><th>ID</th><th>Total</th><th>Date</th></tr>`;
        list.forEach(s=>{
            html += `
            <tr>
                <td>${s.id}</td>
                <td>$${(s.totals.totalCents/100).toFixed(2)}</td>
                <td>${s.createdAt}</td>
            </tr>`;
        });
        document.getElementById("pos-sales-table").innerHTML = html;
    });
}

/* SUBSCRIBERS */
function loadSubscribers(){
    fetch(API + "/api/admin/subscribers", { headers: authHeaders() })
    .then(r=>r.json())
    .then(list=>{
        let html = `<tr><th>Email</th><th>Joined</th></tr>`;
        list.forEach(s=>{
            html += `
            <tr>
                <td>${s.email}</td>
                <td>${s.joinedAt}</td>
            </tr>`;
        });
        document.getElementById("subscribers-table").innerHTML = html;
    });
}

function sendBlast(){
    fetch(API+"/api/admin/email-blast",{
        method:"POST",
        headers:{ ...authHeaders(), "Content-Type":"application/json" },
        body: JSON.stringify({
            subject: document.getElementById("blast-subject").value,
            text: document.getElementById("blast-body").value
        })
    }).then(()=>alert("Sent"));
}

/* ABANDONED CARTS */
function loadAbandoned(){
    fetch(API + "/api/admin/abandoned-carts", { headers: authHeaders() })
    .then(r=>r.json())
    .then(list=>{
        let html = `<tr><th>Email</th><th>Items</th><th>Last Nudged</th><th></th></tr>`;
        list.forEach(c=>{
            const items = c.items.map(i=>`${i.name} x${i.quantity}`).join("<br>");
            html += `
            <tr>
                <td>${c.email}</td>
                <td>${items}</td>
                <td>${c.lastNudgedAt||"-"}</td>
                <td><button onclick="nudge('${c.id}')">Nudge</button></td>
            </tr>`;
        });
        document.getElementById("abandoned-table").innerHTML = html;
    });
}

function nudge(id){
    fetch(API+"/api/admin/abandoned-carts/"+id+"/nudge",{
        method:"POST",
        headers: authHeaders()
    }).then(()=>{
        alert("Nudged");
        loadAbandoned();
    });
}

</script>

</body>
</html>
