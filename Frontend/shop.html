<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop – Faith & Fragrance Co.</title>

  <style>
    :root {
      --bg: #050506;
      --bg-alt: #0d0d10;
      --bg-soft: #121218;
      --text: #f5f3ee;
      --muted: #9a958a;
      --accent: #d3b46a;
      --border: #26252f;
      --radius: 16px;
      --radius-lg: 28px;
      --shadow-soft: 0 30px 60px rgba(0,0,0,0.65);
      --max-width: 1120px;
      --danger: #f28b82;
      --success: #8bd59a;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #14141b, var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* HEADER */
    header {
      background: rgba(5,5,8,0.94);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .nav {
      max-width: var(--max-width);
      margin: auto;
      padding: 0.8rem 1.3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-logo { height: 42px; }

    .logo-text {
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 1.8rem;
      font-size: 0.88rem;
    }

    .nav-links a {
      padding-bottom: 0.1rem;
      color: var(--muted);
      position: relative;
    }

    .nav-links a.active {
      color: var(--text);
    }

    .nav-links a.active::after {
      width: 100%;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1px;
      background: var(--accent);
      transition: width 0.18s;
    }

    .nav-cart {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      padding: 0.45rem 1rem;
      font-size: 0.8rem;
      background: rgba(9,9,14,0.9);
      color: var(--muted);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .cart-count-pill {
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--accent);
      color: #050506;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      padding: 0 0.35rem;
      font-variant-numeric: tabular-nums;
    }

    main {
      max-width: var(--max-width);
      margin: auto;
      padding: 2.5rem 1.3rem 3rem;
    }

    /* SHOP HERO */
    .shop-hero {
      text-align: center;
      margin-bottom: 2.4rem;
    }

    .shop-title {
      font-size: 2.2rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }

    .shop-subtitle {
      max-width: 600px;
      margin: 0 auto;
      color: var(--muted);
    }

    /* FILTERS */
    .shop-filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.4rem;
    }

    .filter-pill {
      padding: 0.45rem 1.1rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(13,13,16,0.9);
      color: var(--muted);
      font-size: 0.82rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .filter-pill.active {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(211,180,106,0.16);
    }

    /* PRODUCT GRID */
    .product-grid {
      display: grid;
      gap: 1.8rem;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      margin-top: 2rem;
    }

    .product-card {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.4rem;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      transition: 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: rgba(211,180,106,0.3);
      box-shadow: 0 40px 80px rgba(0,0,0,0.8);
    }

    .product-image-wrapper {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 0.9rem;
      background: #101018;
    }

    .product-image {
      width: 100%;
      object-fit: cover;
      aspect-ratio: 4 / 3;
    }

    .product-collection {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .product-name {
      font-size: 1.02rem;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      letter-spacing: 0.14em;
    }

    .product-desc {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.8rem;
      flex: 1;
    }

    .product-price {
      color: var(--accent);
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }

    .btn-buy {
      width: 100%;
      padding: 0.75rem;
      border-radius: 999px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      color: #050506;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    /* CART OVERLAY */
    .cart-overlay {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 200;
    }

    .cart-overlay.open { display: block; }

    .cart-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
    }

    .cart-panel {
      position: absolute;
      right: 0;
      top: 0;
      width: min(420px, 100%);
      height: 100vh;
      background: #08080f;
      border-left: 1px solid rgba(255,255,255,0.06);
      box-shadow: -24px 0 60px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      padding: 1.3rem 1.2rem;
      overflow: hidden;
    }

    .cart-header {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .cart-body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding-right: 0.4rem;
      margin-bottom: 0.6rem;
      max-height: calc(100vh - 230px);
    }

    .cart-body::-webkit-scrollbar { width: 6px; }
    .cart-body::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.25);
      border-radius: 999px;
    }

    .cart-empty {
      font-size: 0.9rem;
      color: var(--muted);
      padding: 1rem 0.2rem;
      text-align: left;
    }

    .continue-shopping-btn {
      padding: 0.65rem 1.2rem;
      border-radius: 999px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      margin-top: 0.8rem;
    }

    .continue-shopping-btn:hover {
      background: var(--accent);
      color: #050506;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.4rem 0.8rem;
      padding: 0.7rem 0.1rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 0.88rem;
    }

    .cart-item-controls {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.3rem;
    }

    .cart-qty-btn {
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #101018;
      color: var(--text);
      padding: 0.15rem 0.5rem;
      cursor: pointer;
    }

    .cart-remove {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--danger);
      cursor: pointer;
    }

    .cart-footer {
      flex: 0 0 auto;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 0.8rem;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .btn-checkout {
      width: 100%;
      margin-top: 0.8rem;
      padding: 0.8rem;
      border-radius: 999px;
      background: var(--accent);
      color: #050506;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

  </style>
</head>

<body>

<header>
  <div class="nav">
    <div style="display:flex;align-items:center;gap:0.6rem;">
      <img src="logo.png" class="site-logo" alt="Faith & Fragrance Co. Logo">
      <div class="logo-text">FAITH & FRAGRANCE CO.</div>
    </div>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
    </nav>

    <button class="nav-cart" id="cartButton">
      Cart <span class="cart-count-pill" id="cartCount">0</span>
    </button>
  </div>
</header>

<main>

  <div class="shop-hero">
    <h1 class="shop-title">Our Collections</h1>
    <p class="shop-subtitle">
      Small-batch, hand-poured fragrance designed to bring peace and stillness to your home.
    </p>
  </div>

  <div class="shop-filters">
    <button class="filter-pill active" data-filter="all">All</button>
    <button class="filter-pill" data-filter="jelly-melts">Jelly Wax Melts</button>
    <button class="filter-pill" data-filter="wax-melts">Classic Wax Melts</button>
    <button class="filter-pill" data-filter="candles">Candles</button>
  </div>

  <div id="productGrid" class="product-grid"></div>
  <div id="shopStatus" class="status"></div>

</main>

<footer>
  <div>© <span id="year"></span> Faith & Fragrance Co.</div>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
  </div>
</footer>

<!-- CART DRAWER -->
<div class="cart-overlay" id="cartOverlay">
  <div class="cart-backdrop" id="cartBackdrop"></div>

  <aside class="cart-panel">
    <div class="cart-header">
      <div class="cart-title">Your Cart</div>
      <button class="cart-close" id="cartCloseButton">×</button>
    </div>

    <div class="cart-body" id="cartItems"></div>

    <div class="cart-footer">
      <div class="cart-row">
        <span>Subtotal</span>
        <span id="cartSubtotal">$0.00</span>
      </div>

      <button class="btn-checkout" id="checkoutBtn">
        Checkout
      </button>
    </div>
  </aside>
</div>

<script>
  const API_BASE = location.hostname.includes("localhost")
    ? "http://localhost:4000"
    : "https://faith-fragrance-backend.onrender.com";

  document.getElementById("year").textContent = new Date().getFullYear();

  let cart = JSON.parse(localStorage.getItem("ff_cart_v1") || "[]");
  let allProducts = [];
  let currentFilter = "all";

  function saveCart() {
    localStorage.setItem("ff_cart_v1", JSON.stringify(cart));
  }

  function updateCartCount() {
    document.getElementById("cartCount").textContent =
      cart.reduce((sum, item) => sum + item.quantity, 0);
  }

  function formatPrice(cents) {
    return "$" + (cents / 100).toFixed(2);
  }

  function renderCart() {
    const wrap = document.getElementById("cartItems");

    if (cart.length === 0) {
      wrap.innerHTML = `
        <div class="cart-empty">
          Your cart is empty.
          <button class="continue-shopping-btn" id="continueShopping">Continue Shopping</button>
        </div>
      `;
      document.getElementById("continueShopping")
        .addEventListener("click", closeCart);
      
      document.getElementById("cartSubtotal").textContent = "$0.00";
      return;
    }

    wrap.innerHTML = cart.map(item => `
      <div class="cart-item" data-id="${item.productId}">
        <div>
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-controls">
            <button class="cart-qty-btn" data-action="dec">-</button>
            <span class="cart-qty-value">${item.quantity}</span>
            <button class="cart-qty-btn" data-action="inc">+</button>
            <span class="cart-remove" data-action="remove">Remove</span>
          </div>
        </div>

        <div class="cart-item-price">
          ${formatPrice(item.priceCents * item.quantity)}
        </div>
      </div>
    `).join("");

    document.getElementById("cartSubtotal").textContent =
      formatPrice(cart.reduce((s, i) => s + i.priceCents * i.quantity, 0));
  }

  function openCart() {
    document.getElementById("cartOverlay").classList.add("open");
  }

  function closeCart() {
    document.getElementById("cartOverlay").classList.remove("open");
  }

  document.getElementById("cartButton").addEventListener("click", () => {
    renderCart();
    openCart();
  });

  document.getElementById("cartBackdrop").addEventListener("click", closeCart);
  document.getElementById("cartCloseButton").addEventListener("click", closeCart);

  document.getElementById("cartItems").addEventListener("click", (e) => {
    const itemEl = e.target.closest(".cart-item");
    if (!itemEl) return;

    const id = itemEl.dataset.id;
    const action = e.target.dataset.action;

    if (!action) return;

    const item = cart.find(i => i.productId === id);

    if (action === "inc") item.quantity++;
    if (action === "dec") item.quantity = Math.max(1, item.quantity - 1);
    if (action === "remove") cart = cart.filter(i => i.productId !== id);

    saveCart();
    updateCartCount();
    renderCart();
  });

  document.getElementById("checkoutBtn").addEventListener("click", () => {
  window.location.href = "./checkout/index.html";
  });


  function resolveImg(url) {
    if (!url) return "";
    if (url.startsWith("http")) return url;
    return API_BASE + url;
  }

  async function loadProducts() {
    document.getElementById("shopStatus").textContent = "Loading...";
    const res = await fetch(API_BASE + "/api/products");
    allProducts = await res.json();
    document.getElementById("shopStatus").textContent = "";
    renderProducts();
  }

  function renderProducts() {
    const grid = document.getElementById("productGrid");
    grid.innerHTML = "";

    const products = currentFilter === "all"
      ? allProducts
      : allProducts.filter(p => p.collection.toLowerCase() === currentFilter);

    if (!products.length) {
      grid.innerHTML = `<div style="color:var(--muted);text-align:center;">No products found.</div>`;
      return;
    }

    products.forEach(product => {
      const card = document.createElement("div");
      card.className = "product-card";

      card.innerHTML = `
        <div class="product-image-wrapper">
          <img src="${resolveImg(product.imageUrl)}" class="product-image" alt="">
        </div>
        <div class="product-collection">${product.collection.toUpperCase()}</div>
        <div class="product-name">${product.name}</div>
        <div class="product-desc">${product.description}</div>
        <div class="product-price">${formatPrice(product.priceCents)}</div>
        <button class="btn-buy">Add to cart</button>
      `;

      card.querySelector(".btn-buy").addEventListener("click", () => {
        const existing = cart.find(i => i.productId === product.id);
        if (existing) existing.quantity++;
        else cart.push({
          productId: product.id,
          name: product.name,
          priceCents: product.priceCents,
          quantity: 1
        });

        saveCart();
        updateCartCount();
        renderCart();
        openCart();
      });

      grid.appendChild(card);
    });
  }

  document.querySelectorAll(".filter-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-pill").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      renderProducts();
    });
  });

  updateCartCount();
  loadProducts();

</script>

</body>
</html>
